services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  ai-gateway:
    build:
      context: .
      dockerfile: apps/ai-gateway/Dockerfile
    environment:
      AI_PROVIDER: self_hosted
      AI_RUNTIME: ollama
      AI_BASE_URL: http://ollama:11434
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-qwen3:8b}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-gemma3:4b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-embeddinggemma}
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?set AI_GATEWAY_TOKEN}
      AI_GATEWAY_PORT: 8787
      AI_GATEWAY_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health',{headers:{authorization:'Bearer '+process.env.AI_GATEWAY_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sellfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sellfuse-local-only}
      POSTGRES_DB: sellfuse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  ollama-data:
  postgres-data:
